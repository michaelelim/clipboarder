<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clipboarder</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23667eea'><path d='M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 16H5V5h2v1c0 1.1.9 2 2 2h6c1.1 0 2-.9 2-2V5h2v14z'/><path d='M7 7h10v2H7z'/><path d='M7 11h10v2H7z'/><path d='M7 15h7v2H7z'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div class="title-section">
                    <h1>Clipboarder</h1>
                    <button id="manualCopyBtn" class="manual-copy-btn">
                        <div class="manual-copy-icon">📋</div>
                        <div class="manual-copy-text">
                            <div class="manual-copy-title">Copy Last Used</div>
                            <div class="manual-copy-subtitle" id="manualCopySubtitle">Clip #1</div>
                        </div>
                    </button>
                </div>
                <div class="header-buttons">
                    <button id="addNewClipBtn" class="add-clip-btn" title="Add New Clip">
                        <span>+</span>
                    </button>
                    <button id="saveClipsBtn" class="save-load-btn" title="Save Clips to File">
                        <span>💾</span>
                    </button>
                    <button id="loadClipsBtn" class="save-load-btn" title="Load Clips from File">
                        <span>📁</span>
                    </button>
                    <button id="darkModeToggle" class="dark-mode-toggle" title="Toggle Dark Mode">
                        <span class="toggle-icon">☀️</span>
                    </button>
                </div>
            </div>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search clips..." class="search-input">
            </div>
        </header>

        <div class="tab-navigation" id="tabNavigation">
            <!-- Dynamic tabs rendered by JavaScript -->
        </div>

        <div class="button-grid" id="buttonGrid">
            <!-- Buttons will be generated by JavaScript -->
        </div>

        <div class="quick-numbers">
            <div class="quick-numbers-label">Quick Select:</div>
            <div class="quick-numbers-grid" id="quickNumbersGrid">
                <!-- Quick number buttons will be generated by JavaScript -->
            </div>
        </div>

        <div class="status-bar">
            <span id="statusMessage"></span>
        </div>
        
        <footer class="footer">
            <div class="copyright">
                © 2025 Michael Lim. All rights reserved.
            </div>
        </footer>
    </div>

    <!-- Notification Popup -->
    <div id="notificationPopup" class="notification-popup">
        <div class="notification-content">
            <div class="notification-icon">📋</div>
            <div class="notification-text">
                <div class="notification-title">Copied to Clipboard!</div>
                <div class="notification-subtitle" id="notificationSubtitle"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
